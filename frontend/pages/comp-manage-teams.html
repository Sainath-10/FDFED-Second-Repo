<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Manage Teams</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/pages/subpage.css">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="page-with-sidebar">
  <main class="sub-main">

    <div class="sub-page-header">
      <div class="sub-header-content">
        <h1 class="sub-page-title">Manage Teams</h1>
        <p class="sub-page-subtitle">Manage teams participating in this competition</p>
      </div>
      <a class="btn-back" id="btn-back-to-comp">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="3" x2="4" y2="8"/><line x1="4" y1="8" x2="10" y2="13"/></svg>
        Back to Dashboard
      </a>
    </div>

    <div class="comp-banner" id="comp-banner"></div>
    <div class="teams-stats-row" id="teams-stats-row"></div>

    <div class="sub-panel">
      <div class="sub-panel-toolbar">
        <div class="search-box-wrapper">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#9aa4b2" stroke-width="1.67" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><line x1="14" y1="14" x2="18" y2="18"/></svg>
          <input type="text" class="sub-search" id="teams-search" placeholder="Search teams by name...">
        </div>
        <select class="sub-select" id="teams-status-filter">
          <option value="all">All Status</option>
          <option value="approved">Approved</option>
          <option value="pending">Pending</option>
          <option value="rejected">Rejected</option>
        </select>
        <button class="btn-action btn-approve-sel" id="btn-approve-selected">Approve Selected</button>
        <button class="btn-action btn-reject-sel" id="btn-reject-selected">Reject Selected</button>
      </div>

      <div class="teams-table-wrap">
        <div class="teams-table-header">
          <label class="check-wrap"><input type="checkbox" id="check-all"><span class="checkmark"></span></label>
          <span class="col-team">TEAM</span>
          <span class="col-captain">CAPTAIN</span>
          <span class="col-players">PLAYERS</span>
          <span class="col-regdate">REG. DATE</span>
          <span class="col-status">STATUS</span>
          <span class="col-actions">ACTIONS</span>
        </div>
        <div id="teams-rows"></div>
      </div>

      <div class="sub-pagination" id="teams-pagination"></div>
    </div>

  </main>
</div>
<div id="footer-mount"></div>

<script src="../js/script.js"></script>
<script src="../js/pages/competitions-data.js"></script>
<script src="../js/pages/comp-manage-teams.js"></script>
<script>
  document.getElementById('sidebar-mount').innerHTML = getSidebar('activity', '../');
  document.getElementById('footer-mount').innerHTML = getFooter('../');
</script>
</body>
</html>
