<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Add Administrator</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/super-admin/super-dashboard.css">
  <link rel="stylesheet" href="../../css/pages/super-admin/users.css">
</head>

<body class="super-admin-body">
  <div id="sidebar-mount"></div>
  <main class="sa-main-v2">
    <header class="sa-header-v2" style="display:flex;justify-content:space-between;align-items:center;">
      <div class="sa-header-left">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
          <a href="admins.html" style="color:#c6ff33;text-decoration:none;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px;">
            ← Back to Admins Roster
          </a>
        </div>
        <h1 class="sa-title">Add <span class="accent-text">Administrator</span></h1>
        <p class="sa-desc">Assign administrator access and specific admin type stored directly in PostgreSQL.</p>
      </div>
    </header>

    <section class="sa-users-card" style="max-width:640px;margin-top:24px;padding:32px;">
      <form id="add-admin-page-form" style="display:flex;flex-direction:column;gap:20px;">
        <div>
          <label style="display:block;font-size:13px;font-weight:700;color:#cbd5e1;margin-bottom:8px;">Username *</label>
          <input type="text" id="page-admin-username" class="form-input" placeholder="e.g. disputeadmin" required style="width:100%;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#fff;font-size:14px;">
        </div>

        <div>
          <label style="display:block;font-size:13px;font-weight:700;color:#cbd5e1;margin-bottom:8px;">Admin Type / Role *</label>
          <select id="page-admin-type" class="form-select" required style="width:100%;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#fff;font-size:14px;cursor:pointer;">
            <option value="comp_admin">🏆 Competition Admin (comp_admin)</option>
            <option value="dispute_admin">🛡️ Dispute Admin (dispute_admin)</option>
            <option value="revenue_admin">💳 Revenue Admin (revenue_admin)</option>
            <option value="super_admin">⚡ Super Admin (super_admin)</option>
          </select>
        </div>

        <div style="display:flex;gap:14px;margin-top:12px;">
          <a href="admins.html" style="flex:1;padding:12px;text-align:center;background:none;border:1px solid #334155;color:#94a3b8;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;">Cancel</a>
          <button type="submit" id="add-admin-submit-btn" style="flex:2;padding:12px;background:#c6ff33;border:none;color:#000;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px;box-shadow:0 0 16px rgba(198,255,51,0.25);">
            Save & Grant Admin Access
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="../../js/script.js"></script>
  <script src="../../js/pages/super-admin/add-admin.js"></script>
</body>

</html>
