<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Revoke Administrator</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/super-admin/super-dashboard.css">
  <link rel="stylesheet" href="../../css/pages/super-admin/users.css">
</head>

<body class="super-admin-body">
  <div id="sidebar-mount"></div>
  <main class="sa-main-v2">
    <header class="sa-header-v2" style="display:flex;justify-content:space-between;align-items:center;">
      <div class="sa-header-left">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
          <a href="admins.html" style="color:#ef4444;text-decoration:none;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px;">
            ← Back to Admins Roster
          </a>
        </div>
        <h1 class="sa-title">Revoke <span class="accent-text" style="color:#ef4444;">Admin Privileges</span></h1>
        <p class="sa-desc">Demote an administrator to participant status in PostgreSQL and specify the revocation reason.</p>
      </div>
    </header>

    <section class="sa-users-card" style="max-width:640px;margin-top:24px;padding:32px;border:1px solid rgba(239,68,68,0.3);">
      <form id="revoke-admin-page-form" style="display:flex;flex-direction:column;gap:20px;">
        <div>
          <label style="display:block;font-size:13px;font-weight:700;color:#cbd5e1;margin-bottom:8px;">Admin Username or Email *</label>
          <input type="text" id="page-revoke-username" class="form-input" placeholder="e.g. compadmin@nexus.gg" required style="width:100%;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#fff;font-size:14px;">
        </div>

        <div>
          <label style="display:block;font-size:13px;font-weight:700;color:#cbd5e1;margin-bottom:8px;">Reason for Revocation *</label>
          <textarea id="page-revoke-reason" class="form-input" placeholder="e.g. Policy violation / Security audit demotion..." required rows="4" style="width:100%;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#fff;font-size:14px;resize:vertical;"></textarea>
        </div>

        <div style="display:flex;gap:14px;margin-top:12px;">
          <a href="admins.html" style="flex:1;padding:12px;text-align:center;background:none;border:1px solid #334155;color:#94a3b8;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;">Cancel</a>
          <button type="submit" id="revoke-admin-submit-btn" style="flex:2;padding:12px;background:#ef4444;border:none;color:#fff;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px;box-shadow:0 0 16px rgba(239,68,68,0.3);">
            Confirm & Revoke Access
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="../../js/script.js"></script>
  <script src="../../js/pages/super-admin/revoke-admin.js"></script>
</body>

</html>
