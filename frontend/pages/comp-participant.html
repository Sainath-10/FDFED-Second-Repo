<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Competition</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/pages/comp-participant.css">
</head>

<body>
  <div id="sidebar-mount"></div>
  <div class="page-with-sidebar">
    <main class="part-main">

      <!-- Hero -->
      <div class="part-hero" id="part-hero">
        <div class="part-hero-left">
          <div class="part-hero-tags" id="part-hero-tags"></div>
          <h1 class="part-hero-title" id="part-hero-title">Loading…</h1>
          <div class="part-hero-meta" id="part-hero-meta"></div>
        </div>
        <div class="part-hero-actions" id="part-hero-actions"></div>
      </div>

      <!-- About Panel -->
      <div class="part-about-panel" id="part-about-panel"></div>

      <!-- Two-col body: My Team + Match Schedule -->
      <div class="part-body">

        <div class="part-panel" id="panel-myteam">
          <div class="part-panel-header">
            <div class="part-panel-title-row">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6FF33" stroke-width="2"
                stroke-linecap="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
              <span>My Team</span>
            </div>
          </div>
          <div id="my-team-content"></div>
        </div>

        <div class="part-panel" id="panel-schedule">
          <div class="part-panel-header">
            <div class="part-panel-title-row">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6FF33" stroke-width="2"
                stroke-linecap="round">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              <span>Match Schedule</span>
            </div>
          </div>
          <div class="part-matches-list" id="part-matches-list"></div>
        </div>

      </div>

      <!-- Standings -->
      <div class="part-section" id="part-standings-section">
        <div class="part-panel-header">
          <div class="part-panel-title-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6FF33" stroke-width="2"
              stroke-linecap="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
            <span>Standings</span>
          </div>
        </div>
        <div id="part-standings-table"></div>
      </div>



    </main>
  </div>
  <div id="footer-mount"></div>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- RAISE DISPUTE MODAL                                                -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <div id="modal-raise-dispute" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;">
    <div style="background:#0f172a;border:1px solid #1e293b;border-radius:16px;width:min(96vw,520px);padding:32px;position:relative;box-shadow:0 20px 60px #000a;">
      <button onclick="closeDisputeModal()" style="position:absolute;top:16px;right:18px;background:none;border:none;color:#9aa4b2;font-size:20px;cursor:pointer;">✕</button>
      <h2 style="margin:0 0 6px;color:#f1f5f9;font-size:20px;">⚠ Raise a Dispute</h2>
      <p style="margin:0 0 24px;color:#64748b;font-size:13px;">Select whether the dispute is against a Team, a Player, or the Organizer.</p>

      <form id="dispute-form" onsubmit="submitDispute(event)">
        <div style="margin-bottom:16px;">
          <label style="display:block;color:#94a3b8;font-size:13px;margin-bottom:6px;">Dispute Against *</label>
          <select id="dispute-target-type" required
            style="width:100%;background:#1e293b;border:1px solid #334155;color:#f1f5f9;padding:10px 12px;border-radius:8px;font-size:14px;">
            <option value="">— Select Target Entity —</option>
            <option value="team">Team (Opponent)</option>
            <option value="player">Player (Participant)</option>
            <option value="organizer">Tournament Organizer</option>
          </select>
          <p id="dispute-routing-hint" style="margin:6px 0 0;font-size:12px;color:#64748b;display:none;"></p>
        </div>

        <div style="margin-bottom:16px;" id="target-select-container">
          <label id="target-select-label" style="display:block;color:#94a3b8;font-size:13px;margin-bottom:6px;">Choose Target *</label>
          <select id="dispute-target-user" required
            style="width:100%;background:#1e293b;border:1px solid #334155;color:#f1f5f9;padding:10px 12px;border-radius:8px;font-size:14px;">
            <option value="">— Select Category First —</option>
          </select>
        </div>

        <div style="margin-bottom:16px;">
          <label style="display:block;color:#94a3b8;font-size:13px;margin-bottom:6px;">Reason / Description *</label>
          <textarea id="dispute-reason" required rows="4" placeholder="Describe the issue in detail (min. 10 characters)..."
            style="width:100%;background:#1e293b;border:1px solid #334155;color:#f1f5f9;padding:10px 12px;border-radius:8px;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>
        </div>

        <div style="margin-bottom:24px;">
          <label style="display:block;color:#94a3b8;font-size:13px;margin-bottom:6px;">Evidence Links (optional)</label>
          <input id="dispute-evidence" type="text" placeholder="e.g. https://imgur.com/screenshot, https://youtube.com/clip"
            style="width:100%;background:#1e293b;border:1px solid #334155;color:#f1f5f9;padding:10px 12px;border-radius:8px;font-size:14px;box-sizing:border-box;">
          <p style="margin:5px 0 0;font-size:11px;color:#64748b;">Separate multiple links with a comma</p>
        </div>

        <div style="display:flex;gap:12px;">
          <button type="button" onclick="closeDisputeModal()"
            style="flex:1;padding:12px;background:none;border:1px solid #334155;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:14px;">
            Cancel
          </button>
          <button type="submit"
            style="flex:1;padding:12px;background:#f87171;border:none;color:#fff;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;">
            Submit Dispute
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script src="../js/pages/competitions-data.js"></script>
  <script src="../js/pages/team/team-workflow.js"></script>
  <script src="../js/pages/comp-participant.js"></script>
  <script>
    document.getElementById('sidebar-mount').innerHTML = getSidebar('activity', '../');
    document.getElementById('footer-mount').innerHTML = getFooter('../');

    function openDisputeModal() {
      const modal = document.getElementById('modal-raise-dispute');
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      populateTargetDropdown();
    }

    function closeDisputeModal() {
      const modal = document.getElementById('modal-raise-dispute');
      modal.style.display = 'none';
      document.body.style.overflow = '';
      document.getElementById('dispute-form').reset();
      document.getElementById('dispute-routing-hint').style.display = 'none';
    }

    function populateTargetDropdown() {
      const params = new URLSearchParams(window.location.search);
      const compId = params.get('id') || sessionStorage.getItem('last_comp_id') || 'unknown';
      const targetType = document.getElementById('dispute-target-type').value;
      const targetSelect = document.getElementById('dispute-target-user');
      const label = document.getElementById('target-select-label');
      const hint = document.getElementById('dispute-routing-hint');
      targetSelect.innerHTML = '';

      // Get current logged-in user to prevent self-disputes
      let currentUsername = '';
      let currentTeamName = '';
      try {
        const session = JSON.parse(localStorage.getItem('nexus.auth.session') || '{}');
        currentUsername = (session.username || '').toLowerCase();
        // Try to detect current user's team name
        const comps = JSON.parse(localStorage.getItem('nexus_competitions') || '[]');
        const comp = comps.find(c => c.id === compId);
        if (comp && Array.isArray(comp.teams)) {
          const userMatches = value => String((typeof value === 'string' ? value : (value && (value.username || value.name || value.id))) || '').toLowerCase() === currentUsername;
          const myTeam = comp.teams.find(t =>
            userMatches(t.createdBy) ||
            userMatches(t.leaderId) ||
            userMatches(t.leaderUsername) ||
            userMatches(t.captain) ||
            (Array.isArray(t.members) && t.members.some(userMatches)) ||
            (Array.isArray(t.players) && t.players.some(userMatches))
          );
          if (myTeam) currentTeamName = (myTeam.name || '').toLowerCase();
        }
      } catch(e) {}

      if (!targetType) {
        label.textContent = 'Choose Target *';
        targetSelect.innerHTML = '<option value="">— Select Category First —</option>';
        hint.style.display = 'none';
        return;
      }
      const p = window.NexusData ? window.NexusData.getCompetitionParticipants(compId) : { teams: [], players: [], organizer: 'organizer' };
      if (targetType === 'team') {
        label.textContent = 'Choose Tournament Team *';
        hint.textContent = '📋 Dispute sent to Tournament Organizer for review.';
        hint.style.color = '#94a3b8'; hint.style.display = 'block';
        // Exclude own team
        const teams = p.teams.filter(t => (t.name || '').toLowerCase() !== currentTeamName);
        if (teams.length === 0) { targetSelect.innerHTML = '<option value="">— No other teams available —</option>'; }
        else { targetSelect.innerHTML = '<option value="">— Select a Team —</option>' + teams.map(t => `<option value="${t.name}">${t.name} (${t.status || 'registered'})</option>`).join(''); }
      } else if (targetType === 'player') {
        label.textContent = 'Choose Tournament Player *';
        hint.textContent = '📋 Dispute sent to Tournament Organizer for review.';
        hint.style.color = '#94a3b8'; hint.style.display = 'block';
        // Exclude self
        const players = p.players.filter(u => (u || '').toLowerCase() !== currentUsername);
        if (players.length === 0) { targetSelect.innerHTML = '<option value="">— No other players available —</option>'; }
        else { targetSelect.innerHTML = '<option value="">— Select a Player —</option>' + players.map(u => `<option value="${u}">@${u}</option>`).join(''); }
      } else if (targetType === 'organizer') {
        label.textContent = 'Tournament Organizer *';
        hint.textContent = '📢 Dispute against Organizer is routed directly to Platform Admin.';
        hint.style.color = '#fb923c'; hint.style.display = 'block';
        if ((p.organizer || '').toLowerCase() === currentUsername) {
          targetSelect.innerHTML = '<option value="">You cannot dispute yourself as organizer</option>';
        } else {
          targetSelect.innerHTML = `<option value="${p.organizer}" selected>${p.organizer} (Organizer)</option>`;
        }
      }
    }

    document.getElementById('dispute-target-type').addEventListener('change', populateTargetDropdown);

    function submitDispute(e) {
      e.preventDefault();
      const params = new URLSearchParams(window.location.search);
      const compId = params.get('id') || sessionStorage.getItem('last_comp_id') || 'unknown';
      const targetType = document.getElementById('dispute-target-type').value;
      const targetUserOrTeam = document.getElementById('dispute-target-user').value.trim();
      const reason = document.getElementById('dispute-reason').value.trim();
      const evidenceRaw = document.getElementById('dispute-evidence').value.trim();
      const evidenceUrls = evidenceRaw ? evidenceRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

      if (!targetType || !targetUserOrTeam || reason.length < 10) {
        if (typeof showToast === 'function') showToast('Please fill in all required fields (target and min. 10 chars reason).', 'error');
        return;
      }

      // Prevent self-dispute
      let currentUsername = '';
      try { const s = JSON.parse(localStorage.getItem('nexus.auth.session') || '{}'); currentUsername = (s.username || '').toLowerCase(); } catch(e) {}
      if (currentUsername && (targetUserOrTeam || '').toLowerCase() === currentUsername) {
        if (typeof showToast === 'function') showToast('You cannot raise a dispute against yourself.', 'error');
        return;
      }

      if (window.NexusData && typeof window.NexusData.addDispute === 'function') {
        const sessionRaw = localStorage.getItem('nexus.auth.session');
        let session = null;
        try { if (sessionRaw) session = JSON.parse(sessionRaw); } catch(e) {}
        const result = window.NexusData.addDispute({
          competitionId: compId,
          reportedBy: session?.username || 'anonymous',
          targetType,
          targetUserOrTeam,
          reason,
          evidenceUrls,
          status: targetType === 'organizer' ? 'open_admin' : 'open_organizer',
          organizerWarnings: 0,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        });
        if (result && result.ok === false) {
          if (typeof showToast === 'function') showToast(result.error || 'Dispute blocked.', 'error');
          return;
        }
      }

      closeDisputeModal();
      if (typeof showToast === 'function') {
        showToast('Dispute submitted');
      }
    }

    document.getElementById('modal-raise-dispute').addEventListener('click', function(e) {
      if (e.target === this) closeDisputeModal();
    });
  </script>
</body>

</html>
