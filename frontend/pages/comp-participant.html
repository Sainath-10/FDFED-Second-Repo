<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Competition</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/pages/comp-participant.css">
</head>

<body>
  <div id="sidebar-mount"></div>
  <div class="page-with-sidebar">
    <main class="part-main">

      <!-- Hero -->
      <div class="part-hero" id="part-hero">
        <div class="part-hero-left">
          <div class="part-hero-tags" id="part-hero-tags"></div>
          <h1 class="part-hero-title" id="part-hero-title">Loading…</h1>
          <div class="part-hero-meta" id="part-hero-meta"></div>
        </div>
        <div class="part-hero-actions" id="part-hero-actions"></div>
      </div>

      <!-- About Panel -->
      <div class="part-about-panel" id="part-about-panel"></div>

      <!-- Two-col body: My Team + Match Schedule -->
      <div class="part-body">

        <div class="part-panel" id="panel-myteam">
          <div class="part-panel-header">
            <div class="part-panel-title-row">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6FF33" stroke-width="2"
                stroke-linecap="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
              <span>My Team</span>
            </div>
          </div>
          <div id="my-team-content"></div>
        </div>

        <div class="part-panel" id="panel-schedule">
          <div class="part-panel-header">
            <div class="part-panel-title-row">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6FF33" stroke-width="2"
                stroke-linecap="round">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              <span>Match Schedule</span>
            </div>
          </div>
          <div class="part-matches-list" id="part-matches-list"></div>
        </div>

      </div>

      <!-- Standings -->
      <div class="part-section" id="part-standings-section">
        <div class="part-panel-header">
          <div class="part-panel-title-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6FF33" stroke-width="2"
              stroke-linecap="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
            <span>Standings</span>
          </div>
        </div>
        <div id="part-standings-table"></div>
      </div>



    </main>
  </div>
  <div id="footer-mount"></div>

  <script src="../js/script.js"></script>
  <script src="../js/pages/competitions-data.js"></script>
  <script src="../js/pages/team/team-workflow.js"></script>
  <script src="../js/pages/comp-participant.js"></script>
  <script>
    document.getElementById('sidebar-mount').innerHTML = getSidebar('activity', '../');
    document.getElementById('footer-mount').innerHTML = getFooter('../');
  </script>
</body>

</html>
