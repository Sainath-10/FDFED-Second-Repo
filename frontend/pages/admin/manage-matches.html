<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Matches</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin/manage-matches.css">
</head>
<body>
  <!-- Admin Sidebar -->
  <div id="sidebar-mount"></div>

  <div class="page-with-sidebar">
    <main class="main-content">
      <a href="dashboard.html" class="back-btn-alt">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 8H4M4 8L8 12M4 8L8 4"/>
        </svg>
        Back to Dashboard
      </a>

      <h1 class="admin-title-lg">Matches</h1>
      <p class="admin-subtitle-accent" id="matches-subtitle">Loading matches...</p>

      <!-- Admin Tabs -->
      <div class="admin-comp-tabs">
        <a id="tab-overview"  href="competition-detail.html" class="admin-tab">Overview</a>
        <a id="tab-teams"     href="manage-teams.html"       class="admin-tab">Teams</a>
        <a id="tab-matches"   href="manage-matches.html"     class="admin-tab active">Matches</a>
        <a id="tab-results"   href="match-results.html"      class="admin-tab">Results</a>
        <a id="tab-standings" href="view-standings.html"     class="admin-tab">Standings</a>
      </div>

      <div class="actions-bar">
        <div class="filter-tabs-row">
          <button class="filter-tab active" data-filter="all" onclick="filterMatches('all', this)">All</button>
          <button class="filter-tab" data-filter="upcoming" onclick="filterMatches('upcoming', this)">Upcoming</button>
          <button class="filter-tab" data-filter="live" onclick="filterMatches('live', this)">Live</button>
          <button class="filter-tab" data-filter="completed" onclick="filterMatches('completed', this)">Completed</button>
        </div>
      </div>

      <div class="matches-list-stack" id="matches-list">
        <p style="text-align:center;color:var(--text-muted);padding:30px;">Loading matches...</p>
      </div>
    </main>

    <!-- Footer -->
    <div id="footer-mount"></div>
  </div>

  <script src="../../js/script.js"></script>
  <script src="../../js/pages/competitions-data.js"></script>
  <script src="../../js/pages/admin/manage-matches.js"></script>
</body>
</html>
