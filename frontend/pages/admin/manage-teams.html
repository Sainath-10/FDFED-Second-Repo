<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Manage Teams</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin/manage-teams.css">
</head>
<body>
  <!-- Admin Sidebar -->
  <div id="sidebar-mount"></div>

  <div class="page-with-sidebar">
    <main class="main-content">
      <a href="dashboard.html" class="back-btn-alt">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 8H4M4 8L8 12M4 8L8 4"/>
        </svg>
        Back to Dashboard
      </a>

      <h1 class="admin-title-lg">Teams</h1>
      <p class="admin-subtitle-accent" id="teams-subtitle">Loading teams...</p>

      <!-- Admin Tabs -->
      <div class="admin-comp-tabs">
        <a id="tab-overview"  href="competition-detail.html" class="admin-tab">Overview</a>
        <a id="tab-teams"     href="manage-teams.html"       class="admin-tab active">Teams</a>
        <a id="tab-matches"   href="manage-matches.html"     class="admin-tab">Matches</a>
        <a id="tab-results"   href="match-results.html"      class="admin-tab">Results</a>
        <a id="tab-standings" href="view-standings.html"     class="admin-tab">Standings</a>
      </div>

      <div class="teams-header-row">
        <div class="search-bar teams-search-wrap">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
          <input type="text" id="teams-search-input" placeholder="Search teams…" oninput="filterTable(this.value)">
        </div>
      </div>

      <div class="table-container-card">
        <div class="table-scroll-wrap">
          <table class="admin-table" id="teams-table">
            <thead>
              <tr>
                <th>Team</th>
                <th>Players</th>
                <th>Region</th>
                <th>Status</th>
                <th>Registered</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="teams-table-body">
              <tr>
                <td colspan="6" style="text-align:center;color:var(--text-muted);padding:30px;">Loading teams...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <div id="footer-mount"></div>
  </div>

  <script src="../../js/script.js"></script>
  <script src="../../js/pages/competitions-data.js"></script>
  <script src="../../js/pages/admin/manage-teams.js"></script>
</body>
</html>
