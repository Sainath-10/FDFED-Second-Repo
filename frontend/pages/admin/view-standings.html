<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Standings</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin/view-standings.css">
</head>
<body>
  <!-- Admin Sidebar -->
  <div id="sidebar-mount"></div>

  <div class="page-with-sidebar">
    <main class="main-content">
      <a href="dashboard.html" class="back-btn-alt">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 8H4M4 8L8 12M4 8L8 4"/>
        </svg>
        Back to Dashboard
      </a>

      <h1 class="admin-title-lg">Standings</h1>
      <p class="admin-subtitle-accent" id="standings-subtitle">Loading rankings...</p>

      <!-- Admin Tabs -->
      <div class="admin-comp-tabs">
        <a id="tab-overview"  href="competition-detail.html" class="admin-tab">Overview</a>
        <a id="tab-teams"     href="manage-teams.html"       class="admin-tab">Teams</a>
        <a id="tab-matches"   href="manage-matches.html"     class="admin-tab">Matches</a>
        <a id="tab-results"   href="match-results.html"      class="admin-tab">Results</a>
        <a id="tab-standings" href="view-standings.html"     class="admin-tab active">Standings</a>
      </div>

      <div id="standings-container">
        <p style="text-align:center;color:var(--text-muted);padding:30px;">Loading standings...</p>
      </div>
    </main>

    <!-- Footer -->
    <div id="footer-mount"></div>
  </div>

  <script src="../../js/script.js"></script>
  <script src="../../js/pages/competitions-data.js"></script>
  <script src="../../js/pages/admin/view-standings.js"></script>
</body>
</html>
