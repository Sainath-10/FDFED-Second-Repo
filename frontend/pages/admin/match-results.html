<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Match Results</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin/match-results.css">
</head>
<body>
  <!-- Admin Sidebar -->
  <div id="sidebar-mount"></div>

  <div class="page-with-sidebar">
    <main class="main-content">
      <a href="dashboard.html" class="back-btn-alt">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 8H4M4 8L8 12M4 8L8 4"/>
        </svg>
        Back to Dashboard
      </a>

      <h1 class="admin-title-lg">Match Results</h1>
      <p class="admin-subtitle-accent" id="results-subtitle">Loading results...</p>

      <!-- Admin Tabs -->
      <div class="admin-comp-tabs">
        <a id="tab-overview"  href="competition-detail.html" class="admin-tab">Overview</a>
        <a id="tab-teams"     href="manage-teams.html"       class="admin-tab">Teams</a>
        <a id="tab-matches"   href="manage-matches.html"     class="admin-tab">Matches</a>
        <a id="tab-results"   href="match-results.html"      class="admin-tab active">Results</a>
        <a id="tab-standings" href="view-standings.html"     class="admin-tab">Standings</a>
      </div>

      <div class="table-container-card">
        <div class="table-scroll-wrap">
          <table class="admin-table" id="results-table">
            <thead>
              <tr>
                <th>Match</th>
                <th>Winner</th>
                <th>Score</th>
                <th>Loser</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="results-table-body">
              <tr>
                <td colspan="5" style="text-align:center;color:var(--text-muted);padding:30px;">Loading results...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <div id="footer-mount"></div>
  </div>

  <script src="../../js/script.js"></script>
  <script src="../../js/pages/competitions-data.js"></script>
  <script src="../../js/pages/admin/match-results.js"></script>
</body>
</html>
