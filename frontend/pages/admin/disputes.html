<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Disputes</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin/disputes.css">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="page-with-sidebar">
  <main class="main-content">
    <div class="admin-header-block">
      <h1 class="admin-title-xl">Disputes</h1>
      <p class="admin-subtitle-muted">Review and resolve match disputes across all competitions.</p>
    </div>

    <div class="dash-stats" style="margin-bottom:28px;">
      <div class="dash-stat-card"><div class="dash-stat-icon" style="background:rgba(231,0,11,0.1);">⚠️</div><div><div class="dash-stat-num" id="stat-open">0</div><div class="dash-stat-lbl">Open</div></div></div>
      <div class="dash-stat-card"><div class="dash-stat-icon" style="background:rgba(198,255,51,0.1);">🔺</div><div><div class="dash-stat-num" id="stat-escalated">0</div><div class="dash-stat-lbl">Escalated</div></div></div>
      <div class="dash-stat-card"><div class="dash-stat-icon" style="background:rgba(34,197,94,0.1);">✅</div><div><div class="dash-stat-num" id="stat-resolved">0</div><div class="dash-stat-lbl">Resolved</div></div></div>
    </div>

    <div class="filter-tabs-row" style="margin-bottom:20px;">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="open">Open</button>
      <button class="filter-tab" data-filter="escalated">Escalated</button>
      <button class="filter-tab" data-filter="resolved">Resolved</button>
    </div>

    <div class="disputes-list" id="disputes-list"><!-- Dynamically rendered by disputes.js --></div></div></main>
  <div id="footer-mount"></div>
</div>
<script src="../../js/script.js"></script>
<script src="../../js/pages/admin/disputes.js"></script>
</body>
</html>
