<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ESPORTS — Dispute Center</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin/disputes.css">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="page-with-sidebar">
  <main class="main-content">
    <div class="admin-header-block">
      <h1 class="admin-title-xl">Dispute Center &amp; Resolution</h1>
      <p class="admin-subtitle-muted">Review, investigate, and resolve disputes filed against tournament organizers and users.</p>
    </div>

    <div class="dash-stats" style="margin-bottom:28px;">
      <div class="dash-stat-card"><div class="dash-stat-icon" style="background:rgba(231,0,11,0.1);">⚡</div><div><div class="dash-stat-num" id="stat-organizer">0</div><div class="dash-stat-lbl">Against Organizers</div></div></div>
      <div class="dash-stat-card"><div class="dash-stat-icon" style="background:rgba(59,130,246,0.1);">👥</div><div><div class="dash-stat-num" id="stat-user">0</div><div class="dash-stat-lbl">Against Users/Teams</div></div></div>
      <div class="dash-stat-card"><div class="dash-stat-icon" style="background:rgba(234,179,8,0.1);">🔺</div><div><div class="dash-stat-num" id="stat-escalated">0</div><div class="dash-stat-lbl">Escalated</div></div></div>
      <div class="dash-stat-card"><div class="dash-stat-icon" style="background:rgba(34,197,94,0.1);">✅</div><div><div class="dash-stat-num" id="stat-resolved">0</div><div class="dash-stat-lbl">Resolved</div></div></div>
    </div>

    <div class="filter-tabs-row" style="margin-bottom:20px;">
      <button class="filter-tab active" data-filter="all" onclick="filterDisputes('all', this)">All Disputes</button>
      <button class="filter-tab" data-filter="organizer" onclick="filterDisputes('organizer', this)">⚡ Against Organizers</button>
      <button class="filter-tab" data-filter="user" onclick="filterDisputes('user', this)">👥 Against Users/Teams</button>
      <button class="filter-tab" data-filter="escalated" onclick="filterDisputes('escalated', this)">🔺 Escalated</button>
      <button class="filter-tab" data-filter="resolved" onclick="filterDisputes('resolved', this)">✅ Resolved</button>
    </div>

    <div class="disputes-list" id="disputes-list">
      <!-- Dynamically rendered by disputes.js -->
    </div>
  </main>
  <div id="footer-mount"></div>
</div>
<script src="../../js/api.js"></script>
<script src="../../js/script.js"></script>
<script src="../../js/pages/admin/disputes.js"></script>
</body>
</html>
